<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="wds" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="7" result="offset"/>
      <feFlood flood-color="#060c2a" flood-opacity="0.35"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="wdt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58b4ff"/>
      <stop offset="1" stop-color="#1d5fe0"/>
    </linearGradient>
    <linearGradient id="wdg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wdc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f7ff"/>
      <stop offset="1" stop-color="#d4e4f7"/>
    </linearGradient>
    <linearGradient id="wdsun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe16b"/>
      <stop offset="1" stop-color="#ffb02e"/>
    </linearGradient>
  </defs>

  <!-- Back panel (matching Wild OS Terminal/Videos back card) -->
  <g filter="url(#wds)">
    <rect x="70" y="38" width="170" height="154" rx="22" fill="url(#wdc)"/>
  </g>

  <!-- Mini widget cards visible on the right half of the back panel -->
  <rect x="148" y="54" width="76" height="54" rx="12" fill="#e1ecfc"/>
  <circle cx="170" cy="76" r="11" fill="url(#wdsun)"/>
  <rect x="188" y="69" width="24" height="6" rx="3" fill="#4f8ef7"/>
  <rect x="188" y="80" width="18" height="5" rx="2.5" fill="#9fbbe6"/>

  <rect x="148" y="118" width="76" height="58" rx="12" fill="#ffffff" opacity="0.88"/>
  <rect x="158" y="131" width="56" height="7" rx="3.5" fill="#d3dff2"/>
  <rect x="158" y="131" width="38" height="7" rx="3.5" fill="#3a86ff"/>
  <rect x="158" y="146" width="56" height="7" rx="3.5" fill="#d3dff2"/>
  <rect x="158" y="146" width="46" height="7" rx="3.5" fill="#46c97a"/>
  <rect x="158" y="161" width="34" height="5" rx="2.5" fill="#b9c7dc"/>

  <!-- Front signature rounded-square badge (exact Wild OS proportions) -->
  <g filter="url(#wds)">
    <rect x="14" y="70" width="124" height="124" rx="30" fill="url(#wdt)"/>
    <rect x="14" y="70" width="124" height="124" rx="30" fill="url(#wdg)"/>
    <rect x="15.5" y="71.5" width="121" height="121" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

    <!-- Centered white widget bento glyph -->
    <g transform="translate(76.0 132.0)">
      <rect x="-32" y="-32" width="28" height="28" rx="8" fill="#ffffff"/>
      <rect x="4" y="-32" width="28" height="28" rx="8" fill="#ffffff" opacity="0.86"/>
      <rect x="-32" y="4" width="64" height="28" rx="8" fill="#ffffff"/>
      <rect x="-22" y="15" width="28" height="6" rx="3" fill="#3b82f6" opacity="0.85"/>
      <circle cx="19" cy="18" r="4" fill="#6ff2b0"/>
    </g>
  </g>
</svg>
